name: Coverage

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Use HTTPS for the git dependency
        # `lore` is a git dependency. npm normalizes the GitHub shorthand to
        # `git+ssh://` in the lockfile, and a runner has no SSH key — pacote
        # usually falls back to HTTPS for a public repo, but this makes it
        # deterministic rather than relying on that fallback.
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        run: npm ci

      # Informational only for now: no `threshold` input, so this never
      # fails the job or blocks the PR. See AGENTS.md's "Test coverage
      # gaps" section for the highest-value areas still untested.
      - name: Run tests with coverage and comment on PR
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          test-script: npm run test:coverage
          annotations: coverage
