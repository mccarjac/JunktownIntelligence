name: PR Checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Type Check, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Use HTTPS for the git dependency
        # `lore` is a git dependency. npm normalizes the GitHub shorthand to
        # `git+ssh://` in the lockfile, and a runner has no SSH key — pacote
        # usually falls back to HTTPS for a public repo, but this makes it
        # deterministic rather than relying on that fallback.
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
